# Paste inside the main HTTPS server block of /etc/nginx/sites-available/odora.uz
# (next to the other locations; exact-match "location =" wins over "location /api/").

# Telegram → edge agent. The agent checks X-Telegram-Bot-Api-Secret-Token and forwards to the backend.
location = /api/telegram/webhook {
    # No limit_req here on purpose: Telegram sends up to 40 parallel requests from a few addresses,
    # and the per-IP "api" zone of location /api/ does not apply to this exact-match location.
    client_max_body_size 1m;
    # Update texts are user messages: CRS rules (SQLi/XSS) would block some of them with 403 and Telegram would retry
    # the same update forever, stalling the whole queue. The secret token is the protection here; ModSecurity only logs.
    modsecurity_rules 'SecRuleEngine DetectionOnly';

    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/proxy_params;
}

# Backend health for the agents' checks (also used by a second server's agent). Returns {"status":"ok"}.
location = /health {
    proxy_pass http://127.0.0.1:3001/health;
    include /etc/nginx/proxy_params;
}
