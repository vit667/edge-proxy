services:
  main:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: edge
      POSTGRES_DB: edge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "wal_keep_size=256MB", "-c", "max_slot_wal_keep_size=1GB", "-c", "synchronous_commit=on"]
    volumes:
      - main-data:/var/lib/postgresql/data
      - ./postgres/init-main.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports: ["127.0.0.1:${MAIN_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U edge -d edge"]
      interval: 3s
      timeout: 3s
      retries: 30
  standby:
    image: postgres:17-bookworm
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
      REPLICA_NAME: standby
    entrypoint: ["bash", "/opt/start-replica.sh"]
    volumes:
      - standby-data:/var/lib/postgresql/data
      - ./postgres/start-replica.sh:/opt/start-replica.sh:ro
    ports: ["127.0.0.1:${STANDBY_PORT:-5433}:5432"]
    depends_on:
      main: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U edge -d edge"]
      interval: 3s
      timeout: 3s
      retries: 30
  replica:
    image: postgres:17-bookworm
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
      REPLICA_NAME: replica
    entrypoint: ["bash", "/opt/start-replica.sh"]
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./postgres/start-replica.sh:/opt/start-replica.sh:ro
    ports: ["127.0.0.1:${REPLICA_PORT:-5434}:5432"]
    depends_on:
      main: { condition: service_healthy }
volumes:
  main-data:
  standby-data:
  replica-data:
